<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الخبير على الجوال: بياناتك · جمعيتي</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts.css">
<script>(function(){var w=innerWidth,ph=true,pr='XSignup1';if(pr){if(w<760&&!ph){location.replace(pr+'.html');return}if(w>=760&&ph){location.replace(pr+'.html');return}}if(!ph&&!false&&w<1280){document.documentElement.style.zoom=w/1280}})();</script>


<style>
body{margin:0}
*{box-sizing:border-box}
h1,p{margin:0}
a{color:#1a1a1a;text-decoration:none}
.fld{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:500}
.in{width:100%;height:52px;padding:0 20px;border:1px solid #e3e3e3;border-radius:999px;background:#fff;font-family:inherit;font-size:16px;color:#1a1a1a}
.in::placeholder{color:#6b6b6b}
.req{color:#a3470a}
.hint{color:#545454;font-size:13px;font-weight:400}
.bar{flex:1;height:4px;border-radius:999px;background:#e3e3e3}
.sel{position:relative;display:block}
.sel svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);pointer-events:none}
</style>

</head>
<body dir="rtl" style="width: 390px; margin: 0 auto">
<div style="padding: 8px 12px; background: #1a1a1a; color: #fff; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 13px; font-weight: 500; line-height: 1.6; text-align: center">نسخة عرض للتصميم: الجمعيات والخبراء والفرص أمثلة وهمية</div>

<div style="width: 390px; min-height: 100vh; background: #fff; color: #1a1a1a; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 16px; padding: 12px 16px 32px">
<div style="display: flex; align-items: center; justify-content: space-between"><a href="PhoneXExperts.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-size: 17px; font-weight: 700"><img src="assets/logo.svg" alt="" width="30" height="30">جمعيتي</a><a href="PhoneXExperts.html" style="min-height: 44px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 4px">خروج</a></div>
<p style="margin-top: 20px; font-size: 14px; font-weight: 700">الخطوة 1 من 3 <span style="color: #545454; font-weight: 500">· بياناتك</span></p>
<div aria-hidden="true" style="display: flex; gap: 6px; margin-top: 8px"><span class="bar" style="background: #17533f"></span><span class="bar"></span><span class="bar"></span></div>
<h1 style="margin-top: 20px; font-size: 26px; line-height: 1.4">عرّفنا بنفسك</h1>
<form style="margin-top: 20px; display: flex; flex-direction: column; gap: 18px">
<label class="fld"><span>الاسم <span class="req" aria-hidden="true">*</span></span><input class="in" placeholder="مثلًا: أحمد العتيبي"><span class="hint">يظهر كاملًا في ملفك</span></label>
<label class="fld"><span>المسمى المهني <span class="req" aria-hidden="true">*</span></span><input class="in" placeholder="مثلًا: مستشار مالي"></label>
<label class="fld"><span>المجال <span class="req" aria-hidden="true">*</span></span><span class="sel"><select class="in" style="appearance: none; padding-left: 48px; color: #6b6b6b"><option>اختر المجال</option></select><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#545454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span><span class="hint">مجال واحد، وبه يجدك الناس في صفحة الخبراء</span></label>
<label class="fld"><span>سنوات الخبرة <span class="req" aria-hidden="true">*</span></span><input class="in" dir="ltr" inputmode="numeric" placeholder="مثلًا: 15" style="text-align: right"></label>
<label class="fld"><span>رقم الجوال <span class="req" aria-hidden="true">*</span></span><input class="in" dir="ltr" inputmode="tel" placeholder="05XXXXXXXX" style="text-align: right"><span class="hint">يظهر فقط للجمعية التي تقبل طلبها</span></label>
<a href="PhoneXSignup2.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 4px; border-radius: 999px; background: #17533f; color: #fff; font-weight: 700">تابع</a>
</form>
</div>


</body>
</html>
