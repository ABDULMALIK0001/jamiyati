<style>
body{margin:0}
*{box-sizing:border-box}
h1,h2,p{margin:0}
a{color:#1a1a1a;text-decoration:none}
.fld{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:500}
.in{width:100%;height:52px;padding:0 20px;border:1px solid #e3e3e3;border-radius:999px;background:#fff;font-family:inherit;font-size:16px;color:#1a1a1a}
.req{color:#a3470a}
.opt{color:#545454;font-weight:400}
.chip{height:48px;border:1px solid #e3e3e3;border-radius:14px;background:#fff;font-family:inherit;font-size:15px;font-weight:500;color:#1a1a1a}
.on{background:#e8efec;border:1.5px solid #17533f;color:#17533f;font-weight:700}
.bar{flex:1;height:4px;border-radius:999px;background:#e3e3e3}
</style>

<body dir="rtl" style="width: 390px; margin: 0 auto">
<div style="padding: 8px 12px; background: #1a1a1a; color: #fff; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 13px; font-weight: 500; line-height: 1.6; text-align: center">نسخة عرض للتصميم: الجمعيات والخبراء والفرص أمثلة وهمية</div>

<div style="display: flex; align-items: center; gap: 8px">
<a href="PhoneDashboard.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #ebebeb; font-size: 14px; font-weight: 700">لوحتي</a>
<a href="PhoneMenu.html" aria-label="القائمة" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7.5h14M5 12h14M5 16.5h14"></path></svg></a>
</div>

<div style="padding: 16px 16px 32px">

<h1 style="margin-top: 4px; font-size: 28px; line-height: 1.35">انشر فرصة</h1>

<div class="fld"><span>النوع <span class="req" aria-hidden="true">*</span></span>

<label class="fld"><span>مسمى الفرصة <span class="req" aria-hidden="true">*</span></span><input class="in" value="منسق/ة برامج مجتمعية"></label>
<label class="fld"><span>التصنيف <span class="req" aria-hidden="true">*</span></span><span style="position: relative; display: block"><select class="in" style="appearance: none; padding-left: 48px"><option>اجتماعي</option></select><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#545454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 18px; top: 50%; transform: translateY(-50%); pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg></span></label>
<label class="fld"><span>المدينة <span class="req" aria-hidden="true">*</span></span><span style="position: relative; display: block"><select class="in" style="appearance: none; padding-left: 48px"><option>مكة المكرمة</option></select><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#545454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 18px; top: 50%; transform: translateY(-50%); pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg></span></label>
<div class="fld"><span>نمط العمل <span class="req" aria-hidden="true">*</span></span>
<div role="radiogroup" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><button type="button" role="radio" aria-checked="true" class="chip on">حضوري</button><button type="button" role="radio" aria-checked="false" class="chip">هجين</button><button type="button" role="radio" aria-checked="false" class="chip">عن بعد</button></div></div>
<div class="fld"><span>الراتب الشهري بالريال <span class="opt">(اختياري)</span></span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; color: #545454; font-size: 14px; font-weight: 400">من<input class="in" dir="ltr" inputmode="numeric" value="7000" style="text-align: right"></label>
<label style="display: flex; flex-direction: column; gap: 6px; color: #545454; font-size: 14px; font-weight: 400">إلى<input class="in" dir="ltr" inputmode="numeric" value="9000" style="text-align: right"></label>
</div></div>
<a href="PhonePostStep2.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #17533f; color: #fff; font-weight: 700">التالي</a>
</section>
</div>
</div>
