<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نشر فرصة تطوعية على الجوال · جمعيتي</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts.css">
<script>(function(){var w=innerWidth,ph=true,pr='PostStep1Vol';if(pr){if(w<760&&!ph){location.replace(pr+'.html');return}if(w>=760&&ph){location.replace(pr+'.html');return}}if(!ph&&!false&&w<1280){document.documentElement.style.zoom=w/1280}})();</script>


<style>
body{margin:0}
*{box-sizing:border-box}
h1,h2,p,ol{margin:0}
a{color:#1a1a1a;text-decoration:none}
.nav a{color:#545454;padding:8px 2px}
.fld{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:500}
.in{width:100%;height:52px;padding:0 20px;border:1px solid #e3e3e3;border-radius:999px;background:#fff;font-family:inherit;font-size:16px;color:#1a1a1a}
.req{color:#a3470a}
.chip{height:48px;border:1px solid #e3e3e3;border-radius:14px;background:#fff;font-family:inherit;font-size:15px;font-weight:500;color:#1a1a1a;display:flex;align-items:center;justify-content:center;gap:6px}
.on{background:#e8efec;border:1.5px solid #17533f;color:#17533f;font-weight:700}
.stp{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;color:#6b6b6b}
.dt{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid #e3e3e3;font-size:13px;font-weight:700}
.ln{flex:1;height:1px;background:#e3e3e3}
</style>

</head>
<body dir="rtl" style="width: 390px; margin: 0 auto">
<div style="padding: 8px 12px; background: #1a1a1a; color: #fff; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 13px; font-weight: 500; line-height: 1.6; text-align: center">نسخة عرض للتصميم: الجمعيات والخبراء والفرص أمثلة وهمية</div>

<div style="width: 390px; min-height: 100vh; background: #fff; color: #1a1a1a; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 16px">
<header style="height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e3e3e3"><a href="PhoneHome.html" style="display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700"><img src="assets/logo.svg" alt="" width="34" height="34">جمعيتي</a><div style="display: flex; align-items: center; gap: 8px"><a href="PhoneDashboard.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #ebebeb; font-size: 14px; font-weight: 700">لوحتي</a><a href="PhoneMenu.html" aria-label="القائمة" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7.5h14M5 12h14M5 16.5h14"></path></svg></a></div></header>
<div style="padding: 40px 16px 48px">
<a href="PhoneDashboard.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: #545454; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>العودة للوحتي</a>
<h1 style="margin-top: 8px; font-size: 28px; line-height: 1.35">انشر فرصة</h1>
<nav aria-label="خطوات النشر" style="margin-top: 20px; padding: 16px 20px; border: 1px solid #e3e3e3; border-radius: 20px">
<ol style="display: flex; align-items: center; gap: 10px; padding: 0; list-style: none">
<li class="stp" style="color: #1a1a1a; font-weight: 700"><span class="dt" style="background: #17533f; border-color: #17533f; color: #fff">1</span>الفرصة</li><li class="ln"></li>
<li class="stp"><span class="dt">2</span>التفاصيل</li><li class="ln"></li>
<li class="stp"><span class="dt">3</span>الإرسال</li>
</ol>
</nav>
<section style="margin-top: 20px; padding: 32px; border: 1px solid #e3e3e3; border-radius: 22px; display: flex; flex-direction: column; gap: 22px">
<h2 style="font-size: 22px">الفرصة</h2>
<div class="fld"><span>النوع <span class="req" aria-hidden="true">*</span></span>
<div role="radiogroup" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><a href="PhonePostStep1.html" role="radio" aria-checked="false" class="chip">دوام كامل</a><button type="button" role="radio" aria-checked="false" class="chip">مؤقتة</button><button type="button" role="radio" aria-checked="false" class="chip">دوام جزئي</button><button type="button" role="radio" aria-checked="true" class="chip on">تطوعية</button></div></div>
<label class="fld"><span>مسمى الفرصة <span class="req" aria-hidden="true">*</span></span><input class="in" value="منظِّم/ة فعاليات رمضانية"></label>
<div style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px">
<label class="fld"><span>التصنيف <span class="req" aria-hidden="true">*</span></span><span style="position: relative; display: block"><select class="in" style="appearance: none; padding-left: 48px"><option>اجتماعي</option></select><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#545454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 18px; top: 50%; transform: translateY(-50%); pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg></span></label>
<label class="fld"><span>المدينة <span class="req" aria-hidden="true">*</span></span><span style="position: relative; display: block"><select class="in" style="appearance: none; padding-left: 48px"><option>مكة المكرمة</option></select><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#545454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 18px; top: 50%; transform: translateY(-50%); pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg></span></label>
</div>
<div class="fld"><span>نمط العمل <span class="req" aria-hidden="true">*</span></span>
<div role="radiogroup" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><button type="button" role="radio" aria-checked="true" class="chip on">حضوري</button><button type="button" role="radio" aria-checked="false" class="chip">هجين</button><button type="button" role="radio" aria-checked="false" class="chip">عن بعد</button></div></div>
<div class="fld"><span>المقابل <span class="req" aria-hidden="true">*</span></span>
<span style="margin-top: -4px; color: #545454; font-size: 14px; font-weight: 400">اختر واحدًا أو أكثر، أو «بدون مقابل» وحدها</span>
<div role="group" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><button type="button" aria-pressed="true" class="chip on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>شهادة تطوع</button><button type="button" aria-pressed="true" class="chip on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>بدل تنقل</button><button type="button" aria-pressed="false" class="chip">بدون مقابل</button></div></div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px">
<a href="PhonePostStep2.html" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 36px; border-radius: 999px; background: #17533f; color: #fff; font-weight: 700; box-shadow: 0 4px 8px rgb(23 83 63 / 14%)">التالي</a>
</div>
</section>
</div>
</div>


</body>
</html>
