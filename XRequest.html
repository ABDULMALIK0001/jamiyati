<style>

<body dir="rtl" style="margin: 0">
<div style="padding: 8px 12px; background: #1a1a1a; color: #fff; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 13px; font-weight: 500; line-height: 1.6; text-align: center">نسخة عرض للتصميم: الجمعيات والخبراء والفرص أمثلة وهمية</div>

<div style="width: 100%; min-height: 100vh; background: rgb(26 26 26 / 45%); color: #1a1a1a; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 16px; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-labelledby="t" style="width: 560px; display: flex; flex-direction: column; gap: 18px; padding: 28px; border-radius: 22px; background: #fff; box-shadow: 0 24px 60px rgb(26 26 26 / 20%)">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div><h2 id="t" style="font-size: 22px">أرسل طلبًا</h2><p style="margin-top: 4px; color: #545454; font-size: 14px">إلى أحمد العتيبي، مستشار مالي</p></div>
<a href="xp-1.html" aria-label="أغلق" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none; border-radius: 50%; background: #f2f2f2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div class="fld" role="radiogroup" aria-labelledby="kindq"><span id="kindq">نوع الطلب <span class="req" aria-hidden="true">*</span></span><div style="display: flex; flex-wrap: wrap; gap: 8px"><label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 2px solid #1a1a1a; font-weight: 700; border-radius: 999px; font-size: 15px"><input type="radio" name="kind" checked style="position: absolute; opacity: 0; width: 1px; height: 1px"><span aria-hidden="true" style="width: 18px; height: 18px; flex: none; border-radius: 50%; border: 5px solid #1a1a1a"></span>استشارة</label><label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid #e3e3e3; font-weight: 500; border-radius: 999px; font-size: 15px"><input type="radio" name="kind" style="position: absolute; opacity: 0; width: 1px; height: 1px"><span aria-hidden="true" style="width: 18px; height: 18px; flex: none; border-radius: 50%; border: 2px solid #b5b5b5"></span>تدريب أو ورشة عمل</label><label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid #e3e3e3; font-weight: 500; border-radius: 999px; font-size: 15px"><input type="radio" name="kind" style="position: absolute; opacity: 0; width: 1px; height: 1px"><span aria-hidden="true" style="width: 18px; height: 18px; flex: none; border-radius: 50%; border: 2px solid #b5b5b5"></span>عمل محدد</label></div><span class="hint">هذا ما يقدّمه أحمد العتيبي</span></div>
<label class="fld"><span>عنوان الطلب <span class="req" aria-hidden="true">*</span></span><input class="in" value="مراجعة اللائحة المالية لجمعيتنا"></label>
<label class="fld"><span>ماذا تحتاج بالتفصيل؟ <span class="req" aria-hidden="true">*</span></span><textarea class="in" rows="3" style="height: 112px; padding: 14px 20px; border-radius: 22px; resize: none; line-height: 1.8">لدينا لائحة مالية قديمة، ونحتاج مراجعتها قبل المراجعة السنوية في شهر مارس.</textarea></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label class="fld"><span>اسمك <span class="req" aria-hidden="true">*</span></span><input class="in" value="سلمان الزهراني"></label>
<label class="fld"><span>رقم جوالك للتواصل <span class="req" aria-hidden="true">*</span></span><input class="in" dir="ltr" inputmode="numeric" value="0551234567" style="text-align: right"></label>
</div>
<span class="hint" style="margin-top: -8px">يظهر اسمك وجوالك للخبير بعد قبوله طلبك فقط</span>
<p style="padding: 12px 16px; border-radius: 14px; background: #f2f2f2; color: #545454; font-size: 14px; line-height: 1.7">إذا لم يصل رد خلال 7 أيام، يُغلق الطلب.</p>
