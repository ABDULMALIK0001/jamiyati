<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نشر فرصة على الجوال: التفاصيل · جمعيتي</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts.css">
<script>(function(){var w=innerWidth,ph=true,pr='PostStep2';if(pr){if(w<760&&!ph){location.replace(pr+'.html');return}if(w>=760&&ph){location.replace(pr+'.html');return}}if(!ph&&!false&&w<1280){document.documentElement.style.zoom=w/1280}})();</script>


<style>
body{margin:0}
*{box-sizing:border-box}
h1,h2,p{margin:0}
a{color:#1a1a1a;text-decoration:none}
.fld{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:500}
.in{width:100%;height:52px;padding:0 20px;border:1px solid #e3e3e3;border-radius:999px;background:#fff;font-family:inherit;font-size:16px;color:#1a1a1a}
.in::placeholder{color:#6b6b6b}
.req{color:#a3470a}
.opt{color:#545454;font-weight:400}
.add{align-self:flex-start;min-height:44px;padding:0 2px;border:0;background:transparent;font-family:inherit;font-size:15px;font-weight:700;color:#17533f}
.li{display:flex;align-items:center;gap:8px}
.rm{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border:0;border-radius:50%;background:#f2f2f2;font-size:18px;color:#545454}
.chip{height:48px;border:1px solid #e3e3e3;border-radius:14px;background:#fff;font-family:inherit;font-size:15px;font-weight:500;color:#1a1a1a}
.on{background:#e8efec;border:1.5px solid #17533f;color:#17533f;font-weight:700}
.bar{flex:1;height:4px;border-radius:999px;background:#e3e3e3}
</style>

</head>
<body dir="rtl" style="width: 390px; margin: 0 auto">
<div style="padding: 8px 12px; background: #1a1a1a; color: #fff; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 13px; font-weight: 500; line-height: 1.6; text-align: center">نسخة عرض للتصميم: الجمعيات والخبراء والفرص أمثلة وهمية</div>

<div style="width: 390px; min-height: 100vh; background: #fff; color: #1a1a1a; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 16px">
<header style="height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e3e3e3">
<a href="PhoneHome.html" style="display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700"><img src="assets/logo.svg" alt="" width="34" height="34">جمعيتي</a>
<div style="display: flex; align-items: center; gap: 8px">
<a href="PhoneDashboard.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #ebebeb; font-size: 14px; font-weight: 700">لوحتي</a>
<a href="PhoneMenu.html" aria-label="القائمة" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7.5h14M5 12h14M5 16.5h14"></path></svg></a>
</div>
</header>
<div style="padding: 16px 16px 32px">
<a href="PhoneDashboard.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: #545454; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>العودة للوحتي</a>
<h1 style="margin-top: 4px; font-size: 28px; line-height: 1.35">انشر فرصة</h1>
<div style="margin-top: 16px">
<p style="font-size: 14px; font-weight: 700">الخطوة 2 من 3 <span style="color: #545454; font-weight: 500">· التفاصيل</span></p>
<div aria-hidden="true" style="display: flex; gap: 6px; margin-top: 8px"><span class="bar" style="background: #17533f"></span><span class="bar" style="background: #17533f"></span><span class="bar"></span></div>
</div>
<section style="margin-top: 20px; display: flex; flex-direction: column; gap: 22px">
<label class="fld"><span>عن الفرصة <span class="req" aria-hidden="true">*</span></span><textarea class="in" rows="4" style="height: 150px; padding: 14px 20px; border-radius: 22px; resize: none; line-height: 1.8">نبحث عن شخص يتابع برامج الأسر في أحياء مكة، وينسق بين فريق الجمعية والمتطوعين.</textarea><span class="opt" style="font-size: 14px">لا تكتب رقم جوال هنا، فالتقديم يكون بالرابط أو البريد</span></label>
<div class="fld"><span>المهام <span class="req" aria-hidden="true">*</span></span>
<div class="li"><input class="in" aria-label="المهمة 1" value="متابعة البرامج الأسبوعية للأسر"></div>
<div class="li"><input class="in" aria-label="المهمة 2" value="تنسيق مواعيد المتطوعين"><button type="button" class="rm" aria-label="احذف">×</button></div>
<button type="button" class="add">+ أضف مهمة</button></div>
<div class="fld"><span>المتطلبات <span class="req" aria-hidden="true">*</span></span>
<div class="li"><input class="in" aria-label="المتطلب 1" value="بكالوريوس في الخدمة الاجتماعية"></div>
<button type="button" class="add">+ أضف متطلبًا</button></div>
<div class="fld"><span>المزايا <span class="opt">(اختياري)</span></span>
<div class="li"><input class="in" aria-label="الميزة 1" placeholder="مثلًا: تأمين طبي"></div>
<button type="button" class="add">+ أضف ميزة</button></div>
<div class="fld"><span>طريقة التقديم <span class="req" aria-hidden="true">*</span></span>
<div role="radiogroup" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button type="button" role="radio" aria-checked="false" class="chip">رابط</button><button type="button" role="radio" aria-checked="true" class="chip on">بريد</button></div>
<input class="in" dir="ltr" aria-label="بريد التقديم" value="hr@namaa.org.sa" style="text-align: right">
<span class="opt" style="font-size: 14px">يظهر هذا البريد للمتقدمين</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<a href="PhonePostStep3.html" style="align-self: stretch; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #17533f; color: #fff; font-weight: 700">التالي</a>
<a href="PhonePostStep1.html" style="min-height: 44px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 500; text-decoration: underline; text-underline-offset: 4px">رجوع</a>
</div>
</section>
</div>
</div>


</body>
</html>
