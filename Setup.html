<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>عرّفنا بجمعيتك · جمعيتي</title>

<script>(function(){var w=innerWidth,ph=false,pr='';if(pr){if(w<760&&!ph){location.replace(pr+'.html');return}if(w>=760&&ph){location.replace(pr+'.html');return}}if(!ph&&!true&&w<1280){document.documentElement.style.zoom=w/1280}})();</script>


<style>
body{margin:0}
*{box-sizing:border-box}
h1,p{margin:0}
a{color:#1a1a1a;text-decoration:none}
.fld{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:500}
.in{width:100%;height:52px;padding:0 20px;border:1px solid #e3e3e3;border-radius:999px;background:#fff;font-family:inherit;font-size:16px;color:#1a1a1a}
.in::placeholder{color:#6b6b6b}
.req{color:#a3470a}
</style>

</head>
<body dir="rtl" style="margin: 0">
<div style="padding: 8px 12px; background: #1a1a1a; color: #fff; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 13px; font-weight: 500; line-height: 1.6; text-align: center">نسخة عرض للتصميم: الجمعيات والخبراء والفرص أمثلة وهمية</div>

<div style="width: 100%; min-height: 100vh; background: #fff; color: #1a1a1a; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 16px; display: flex; align-items: center; justify-content: center">
<form style="width: 340px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="index.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-size: 17px; font-weight: 700"><img src="assets/logo.svg" alt="" width="30" height="30">جمعيتي</a>
<button type="button" style="min-height: 44px; padding: 0; border: 0; background: none; font-family: inherit; font-size: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 4px">خروج</button>
</div>
<h1 style="font-size: 30px; line-height: 1.4">عرّفنا بجمعيتك</h1>
<p style="margin-top: -8px; color: #545454; font-size: 14px">نراجع بياناتك خلال يومي عمل</p>
<label class="fld"><span>اسم الجمعية <span class="req" aria-hidden="true">*</span></span><input class="in" placeholder="مثلًا: جمعية نماء الأهلية"><span style="color: #545454; font-size: 13px; font-weight: 400">اكتبه كما في الترخيص، فلا يتغير بعد التوثيق</span></label>
<label class="fld"><span>رقم الترخيص <span class="req" aria-hidden="true">*</span></span><input class="in" dir="ltr" inputmode="numeric" style="text-align: right"><span style="color: #545454; font-size: 13px; font-weight: 400">تجده في شهادة تسجيل الجمعية</span></label>
<a href="DashboardNew.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #17533f; color: #fff; font-size: 16px; font-weight: 700; box-shadow: 0 4px 8px rgb(23 83 63 / 14%)">تابع</a>
</form>
</div>
