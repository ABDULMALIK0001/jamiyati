<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحة الجمعية — جمعيتي</title>
<meta name="description" content="نسخة تجريبية: فرص وظيفية وتطوعية من الجمعيات في مكان واحد">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/plex-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/plex-arabic-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css?v=31">
</head>
<body>
<div class="frame">
  <div class="demo-bar" role="note">نسخة تجريبية للعرض · الجمعيات والفرص المعروضة أمثلة</div>
  <header class="hd">
    <div class="hd-in">
      <a class="brand" href="org.html"><img src="assets/logo.svg" alt="" aria-hidden="true"><b>جمعيتي</b></a>
      <nav class="nav" aria-label="روابط الجمعية">
        <a href="org.html" aria-current="page">صفحة الجمعية</a><a href="post.html?f=1">انشر فرصة</a><a href="index.html">الموقع العام</a>
      </nav>
      <div class="hd-actions">
        <a class="btn btn-ghost" href="index.html">خروج</a>
        <button type="button" class="menu-btn" aria-label="القائمة" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7.5h14M5 12h14M5 16.5h14"/></svg></button>
      </div>
    </div>
    <nav class="mnav" data-open="false" aria-label="القائمة">
      <a href="org.html" aria-current="page">صفحة الجمعية</a><a href="post.html?f=1">انشر فرصة</a><a href="index.html">الموقع العام</a>
    </nav>
  </header>
  <main class="wrap"><div class="org-wrap" id="org"></div></main>
</div>
<div class="ov" id="addDlg" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="addT">
  <h2 id="addT">شعار الجمعية ونبذتها</h2>
  <div class="fld2">
    <span class="lbl" id="logoLbl">الشعار</span>
    <label class="drop" id="drop" for="logoIn">
      <input type="file" id="logoIn" class="sr" accept="image/png,image/jpeg" aria-labelledby="logoLbl" aria-describedby="logoHint logoErr">
      <span class="drop-empty" id="dropEmpty"><span class="sq"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></span><span><b>اختر صورة الشعار</b><span id="logoHint">أو اسحبها هنا · PNG أو JPG، حتى 2 ميجا</span></span></span>
      <span class="drop-full" id="dropFull" hidden><span class="logo-prev"><img id="logoPrev" alt="معاينة الشعار"></span><span class="fname" id="logoName"></span></span>
    </label>
    <div class="logo-acts" id="logoActs" hidden><button type="button" class="lnk" id="logoChange">تغيير</button><button type="button" class="lnk" id="logoRemove">حذف</button></div>
    <span class="ferr" id="logoErr" hidden></span>
  </div>
  <div class="fld2">
    <label class="lbl" for="orgBio">نبذة قصيرة</label>
    <span class="hint2" id="bioHint">جملة أو جملتين عن الجمعية ومجال عملها</span>
    <textarea class="in" id="orgBio" rows="3" aria-describedby="bioHint bioCount" placeholder="مثلًا: جمعية تعمل على ترميم وتأهيل منازل الأسر المحتاجة"></textarea>
    <span class="bio-count" id="bioCount" aria-live="polite"></span>
  </div>
  <div class="btns"><button type="button" class="btn" id="saveAdd">احفظ</button><button type="button" class="btn btn-ghost" data-close>رجوع</button></div>
</div></div>
<div class="ov" id="stopDlg" hidden><div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="stopT">
  <h2 id="stopT">إيقاف الفرصة؟</h2>
  <p>ستختفي الفرصة من الموقع، ويمكنك نشرها مرة أخرى بعد المراجعة</p>
  <div class="btns"><button type="button" class="btn btn-danger" id="stopOk">تأكيد الإيقاف</button><button type="button" class="btn btn-ghost" data-close>رجوع</button></div>
</div></div>
<script src="assets/data.js"></script>
<script src="assets/app.js?v=9"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search), isNew=q.get('s')==='new';
  var ST={tab:'all', name:isNew?(function(){try{return sessionStorage.getItem('jam_org')||'جمعية أثر للعمل التطوعي';}catch(e){return 'جمعية أثر للعمل التطوعي';}})():'جمعية نماء الأهلية', about:isNew?'':'جمعية أهلية تعمل في تنمية الأسر وتمكين الشباب في أحياء مكة',
    logo:isNew?'':'<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#F3E6CF"/><path d="M24 36c-7-4-11-8.5-11-14a6 6 0 0 1 11-3.3A6 6 0 0 1 35 22c0 5.5-4 10-11 14z" fill="#C8742A"/><path d="M24 30v-9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>', city:'مكة المكرمة', verified:!isNew};
  var OPPS=isNew?[]:[
    {id:'j1',t:'منسق/ة برامج مجتمعية',type:'دائمة',cat:'اجتماعي',city:'مكة المكرمة',st:'live',lab:'منشورة',due:'تنتهي بعد 26 يومًا'},
    {t:'مساعد/ة إداري/ة',type:'دوام جزئي',cat:'إداري',city:'مكة المكرمة',st:'wait',lab:'تحت المراجعة',due:'نراجعها خلال يومي عمل'},
    {t:'محاسب/ة',type:'دوام جزئي',cat:'مالي ومحاسبي',city:'جدة',st:'no',lab:'مرفوضة',why:'رابط التقديم لا يعمل'},
    {t:'أخصائي/ة اجتماعي/ة',type:'مؤقتة',cat:'اجتماعي',city:'مكة المكرمة',st:'end',lab:'منتهية',due:'انتهت 12 أكتوبر'}
  ];
  var gone=window.demo.stopped();
  OPPS.forEach(function(o){if(o.id&&gone.indexOf(o.id)>-1){o.st='end';o.lab='متوقفة';o.due='أوقفتها الجمعية';}});
  window.demo.posted().forEach(function(x){
    var st=gone.indexOf(x.id)>-1?'end':x.st;
    OPPS.unshift({id:x.id,t:x.title,type:x.type,cat:x.cat,city:x.city,st:st,lab:{wait:'تحت المراجعة',live:'منشورة',no:'مرفوضة',end:'متوقفة'}[st],due:{wait:'نراجعها خلال يومي عمل',live:'تنتهي بعد 30 يومًا',end:'أوقفتها الجمعية'}[st],why:st==='no'?x.why:undefined});
  });
  var TABS=[['all','الكل'],['live','منشورة'],['wait','تحت المراجعة'],['end','منتهية']];
  function count(k){return OPPS.filter(function(o){return k==='all'||o.st===k||(k==='end'&&o.st==='no');}).length;}
  function closeMenus(){document.querySelectorAll('.menu').forEach(function(m){m.hidden=true;}); document.querySelectorAll('.more').forEach(function(b){b.setAttribute('aria-expanded','false');});}
  window.closeMenus=closeMenus;
  function render(){
    var letter=ST.name.replace('جمعية ','').charAt(0), missing=[];
    if(!ST.logo) missing.push('الشعار'); if(!ST.about) missing.push('النبذة');
    var h='<section class="idc"><div class="idc-top"><span class="idc-logo">'+(ST.logo||window.esc(letter))+'</span><div class="idc-txt"><h1>'+window.esc(ST.name)+'</h1>'+
      '<span class="vbadge '+(ST.verified?'ok':'wait')+'">'+(ST.verified?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg> جمعية موثقة':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> بياناتك تحت المراجعة')+'</span></div></div>'+
      (ST.about?'<p class="idc-bio">'+ST.about.replace(/</g,'&lt;')+'</p>':'')+
      (missing.length?'<div class="complete"><div><b>أكمل ملف جمعيتك</b><span>أضف '+missing.join(' و')+' لتظهر فرصك بشكل أوضح للباحثين</span></div><button type="button" class="btn btn-ghost" data-open="addDlg">أكمل</button></div>':'')+
      '</section>';
    h+='<section class="ops"><div class="ops-hd"><h2>فرصك</h2>'+(OPPS.length?'<a class="btn" href="post.html?f=1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> انشر فرصة</a>':'')+'</div>';
    if(!OPPS.length){
      h+='<div class="ops-empty"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12h18"/></svg></span><h3>لم تنشر أي فرصة بعد</h3><p>انشر فرصتك الأولى، ونراجعها مع بيانات جمعيتك خلال يومي عمل</p><a class="btn btn-lg" href="post.html?f=1">انشر فرصتك الأولى</a></div>';
    } else {
      var order={no:0,wait:1,live:2}, act=OPPS.filter(function(o){return o.st!=='end';}).sort(function(a,b){return order[a.st]-order[b.st];}), old=OPPS.filter(function(o){return o.st==='end';});
      function row(o){
        var menu=o.st==='live'?'<div class="mwrap"><button type="button" class="more" aria-label="خيارات الفرصة" aria-expanded="false" aria-haspopup="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button><div class="menu" role="menu" hidden><a role="menuitem" href="opportunity.html?id='+o.id+'">عرض الفرصة</a><button type="button" role="menuitem" class="danger" data-open="stopDlg" data-stop="'+window.esc(o.id)+'">إيقاف الفرصة</button></div></div>':'';
        return '<article class="orow'+(o.st==='no'?' need':'')+'"><div class="orow-main">'+(o.st==='no'?'<span class="need-tag">تحتاج تعديل</span>':'')+'<div class="orow-t"><h3>'+window.esc(o.t)+'</h3><span class="status '+o.st+'">'+o.lab+'</span></div>'+
          '<p class="sub">'+window.esc([o.type,o.cat,o.city].join(' · '))+'</p>'+(o.due?'<p class="sub when">'+o.due+'</p>':'')+(o.why?'<p class="reason">السبب: '+window.esc(o.why)+'. لتعديلها <a href="about.html#contact">تواصل معنا</a></p>':'')+'</div>'+menu+'</article>';
      }
      h+='<div class="olist">'+act.map(row).join('')+'</div>';
      if(old.length) h+='<details class="ended"><summary>الفرص المنتهية <span class="c">'+old.length+'</span></summary><div class="olist">'+old.map(row).join('')+'</div></details>';
    }
    h+='</section><p class="foot-note">لتعديل فرصة منشورة أو لأي استفسار، <a href="about.html#contact">تواصل معنا</a></p>';
    document.getElementById('org').innerHTML=h;
  }
  var MAX=250, WARN=200, logoURL='';
  var $=function(id){return document.getElementById(id);};
  var bio=$('orgBio'), cnt=$('bioCount'), inp=$('logoIn'), drop=$('drop'), err=$('logoErr');
  function fitBio(){
    bio.style.height='auto';
    var hgt=Math.min(Math.max(bio.scrollHeight+2,120),200);
    bio.style.height=hgt+'px';
    bio.style.overflowY=bio.scrollHeight>hgt?'auto':'hidden';
    var n=bio.value.length, over=n>MAX;
    cnt.textContent=over?('زادت النبذة '+(n-MAX)+' حرفًا عن الحد'):(n>=WARN?('بقي '+(MAX-n)+' حرفًا'):'');
    cnt.classList.toggle('over',over); bio.classList.toggle('bad',over);
  }
  function showErr(m){err.textContent=m; err.hidden=!m;}
  function setLogo(file){
    showErr('');
    if(!file) return;
    if(['image/png','image/jpeg'].indexOf(file.type)<0){showErr('اختر صورة PNG أو JPG'); inp.value=''; return;}
    if(file.size>2*1024*1024){showErr('اختر صورة أصغر من 2 ميجا'); inp.value=''; return;}
    if(logoURL) URL.revokeObjectURL(logoURL);
    logoURL=URL.createObjectURL(file);
    $('logoPrev').src=logoURL; $('logoName').textContent=file.name;
    $('dropEmpty').hidden=true; $('dropFull').hidden=false; $('logoActs').hidden=false; drop.classList.add('has');
  }
  function clearLogo(){
    if(logoURL) URL.revokeObjectURL(logoURL); logoURL=''; inp.value=''; showErr('');
    $('dropEmpty').hidden=false; $('dropFull').hidden=true; $('logoActs').hidden=true; drop.classList.remove('has');
  }
  inp.addEventListener('change',function(){setLogo(inp.files[0]);});
  ['dragenter','dragover'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('drag');});});
  ['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('drag');});});
  drop.addEventListener('drop',function(e){var f=e.dataTransfer&&e.dataTransfer.files[0]; if(f) setLogo(f);});
  $('logoChange').addEventListener('click',function(){inp.click();});
  $('logoRemove').addEventListener('click',clearLogo);
  bio.addEventListener('input',fitBio);
  function closeAll(){document.querySelectorAll('.ov').forEach(function(d){d.hidden=true;});}
  $('saveAdd').addEventListener('click',function(){
    if(bio.value.length>MAX){fitBio(); bio.focus(); return;}
    var txt=bio.value.trim();
    if(logoURL){ST.logo='<img src="'+logoURL+'" alt="">';}
    if(txt){ST.about=txt;}
    render(); closeAll();
  });
  var stopId=null;
  document.addEventListener('click',function(e){
    if(e.target.id==='stopOk'){
      closeAll(); if(!stopId) return;
      window.demo.stop(stopId);
      OPPS.forEach(function(x){if(x.id===stopId){x.st='end';x.lab='متوقفة';x.due='أوقفتها الجمعية';x.why=undefined;}});
      render(); window.demoToast('أُوقفت الفرصة واختفت من الموقع'); return;
    }
    var o=e.target.closest('[data-open]'); if(o){stopId=o.dataset.stop||null; closeMenus(); $(o.dataset.open).hidden=false; if(o.dataset.open==='addDlg') fitBio(); return;}
    var m=e.target.closest('.more'); if(m){var mn=m.nextElementSibling, was=!mn.hidden; closeMenus(); mn.hidden=was; m.setAttribute('aria-expanded',String(!was)); return;}
    if(!e.target.closest('.menu')) closeMenus();
    if(e.target.closest('[data-close]')||e.target.classList.contains('ov')) closeAll();
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeAll();closeMenus();}});
  var d=q.get('d'); if(d&&$(d)){$(d).hidden=false; if(d==='addDlg') fitBio();}
  render();
})();
</script>
</body></html>
