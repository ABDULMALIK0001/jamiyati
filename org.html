<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الفرصة — جمعيتي</title>
<meta name="description" content="نسخة تجريبية: فرص وظيفية وتطوعية من الجمعيات في مكان واحد">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=15">
</head>
<body>
<div class="frame">
  <div class="demo-bar" role="note">نسخة تجريبية للعرض · الجمعيات والفرص المعروضة أمثلة</div>
  <header class="hd">
    <div class="hd-in">
      <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" aria-hidden="true"><b>جمعيتي</b></a>
      <nav class="nav" aria-label="روابط الموقع">
        <a href="index.html#opps">الفرص</a>
        <a href="index.html#how">كيف تعمل؟</a>
        <a href="index.html#orgs">للجمعيات</a>
        <a href="index.html#faq">الأسئلة الشائعة</a>
      </nav>
      <div class="hd-actions">
        <a class="btn btn-ghost" href="post.html">خروج</a>
        <button type="button" class="menu-btn" aria-label="القائمة" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7.5h14M5 12h14M5 16.5h14"/></svg></button>
      </div>
    </div>
    <nav class="mnav" data-open="false" aria-label="القائمة">
      <a href="index.html#opps">الفرص</a><a href="index.html#how">كيف تعمل؟</a><a href="index.html#orgs">للجمعيات</a><a href="index.html#faq">الأسئلة الشائعة</a>
    </nav>
  </header>
  <main class="wrap"><div class="org-wrap" id="org"></div></main>
</div>
<div class="ov" id="addDlg" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="addT">
  <h2 id="addT">شعار الجمعية ونبذتها</h2>
  <div class="up"><span class="sq"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#545454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></span><span><b>ارفع الشعار</b>PNG أو JPG، مربع يفضّل</span></div>
  <label class="lbl">نبذة قصيرة<textarea class="in" rows="3" placeholder="مثلًا: جمعية أهلية في مكة تعمل في تنمية الأسر منذ 2012"></textarea></label>
  <div class="btns"><button type="button" class="btn" data-close>احفظ</button><button type="button" class="btn btn-ghost" data-close>رجوع</button></div>
</div></div>
<div class="ov" id="stopDlg" hidden><div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="stopT">
  <h2 id="stopT">إيقاف الفرصة؟</h2>
  <p>ستختفي الفرصة من الموقع ولا يمكن استرجاعها</p>
  <div class="btns"><button type="button" class="btn btn-danger" data-close>تأكيد الإيقاف</button><button type="button" class="btn btn-ghost" data-close>رجوع</button></div>
</div></div>
<script src="assets/data.js"></script>
<script src="assets/app.js?v=5"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search), isNew=q.get('s')==='new';
  var name=isNew?'جمعية أثر للعمل التطوعي':'جمعية نماء الأهلية';
  var about=isNew?'':'جمعية أهلية تعمل في تنمية الأسر وتمكين الشباب منذ 2012';
  var LOGO='<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#F3E6CF"/><path d="M24 36c-7-4-11-8.5-11-14a6 6 0 0 1 11-3.3A6 6 0 0 1 35 22c0 5.5-4 10-11 14z" fill="#C8742A"/><path d="M24 30v-9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
  var OPPS=[
    {t:'منسق/ة برامج مجتمعية',type:'دائمة',cat:'اجتماعي',city:'مكة المكرمة',st:'live',lab:'منشورة',due:'تنتهي بعد 26 يومًا'},
    {t:'منظِّم/ة فعاليات رمضانية',type:'تطوعية',cat:'اجتماعي',city:'مكة المكرمة',st:'wait',lab:'تحت المراجعة',due:''},
    {t:'محاسب/ة',type:'دوام جزئي',cat:'مالي ومحاسبي',city:'جدة',st:'no',lab:'مرفوضة',due:'',why:'رابط التقديم لا يعمل'},
    {t:'أخصائي/ة اجتماعي/ة',type:'مؤقتة',cat:'اجتماعي',city:'مكة المكرمة',st:'end',lab:'منتهية',due:'انتهت 12 أكتوبر'}
  ];
  var h='<p class="demo-sw">للعرض: <a href="org.html?s=new"'+(isNew?' aria-current="page"':'')+'>جمعية جديدة</a> · <a href="org.html"'+(isNew?'':' aria-current="page"')+'>جمعية لديها فرص</a></p>'+
    '<div class="org-head"><div class="org-id"><span class="org-logo">'+(isNew?name.replace('جمعية ','').charAt(0):LOGO)+'</span><div><h1>'+name+'</h1>'+(about?'<p>'+about+'</p>':'')+'</div></div>'+
    '<a class="btn btn-lg" href="post.html?f=1">انشر فرصة</a></div>';
  if(isNew) h+='<div class="note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#545454" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>نراجع بيانات جمعيتك خلال يوم عمل، ويمكنك نشر فرصتك الآن</div>'+
    '<div class="tip"><div><b>أضف شعار جمعيتك ونبذة عنها</b><span>لتظهر فرصك بشكل أوضح للباحثين</span></div><button type="button" class="btn btn-ghost" data-open="addDlg">أضف</button></div>'+
    '<div class="empty"><h2>لم تنشر أي فرصة بعد</h2><p>انشر فرصتك الأولى، ونراجعها مع بيانات جمعيتك</p><a class="btn btn-ghost" href="post.html?f=1">انشر فرصتك الأولى</a></div>';
  else h+='<section class="list"><div class="list-hd"><h2>فرصك</h2><span class="muted">'+OPPS.length+' فرص</span></div>'+OPPS.map(function(o){
    return '<div class="opp-row"><div><h3>'+o.t+'</h3><p class="sub">'+[o.type,o.cat,o.city].join(' · ')+'</p>'+(o.due?'<p class="sub">'+o.due+'</p>':'')+'</div>'+
      '<span class="status '+o.st+'">'+o.lab+'</span>'+
      
      '<span class="act">'+(o.st==='live'?'<button type="button" class="btn btn-ghost" data-open="stopDlg">إيقاف الفرصة</button>':'')+'</span>'+
      (o.why?'<p class="reason">السبب: '+o.why+'</p>':'')+'</div>';
  }).join('')+'</section>';
  h+='<p class="foot-note">لتعديل بياناتك أو فرصة منشورة <a href="#">تواصل معنا</a></p>';
  document.getElementById('org').innerHTML=h;
  document.addEventListener('click',function(e){
    var o=e.target.closest('[data-open]'); if(o){document.getElementById(o.dataset.open).hidden=false;return;}
    if(e.target.closest('[data-close]')||e.target.classList.contains('ov')) document.querySelectorAll('.ov').forEach(function(d){d.hidden=true;});
  });
  var d=q.get('d'); if(d) document.getElementById(d).hidden=false;
})();
</script>
</body></html>
