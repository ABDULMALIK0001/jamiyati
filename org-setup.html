<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الفرصة — جمعيتي</title>
<meta name="description" content="نسخة تجريبية: فرص وظيفية وتطوعية من الجمعيات في مكان واحد">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=23">
</head>
<body>
<div class="frame">
  <div class="demo-bar" role="note">نسخة تجريبية للعرض · الجمعيات والفرص المعروضة أمثلة</div>
  <main class="login"><form class="login-box" id="sf" novalidate>
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" aria-hidden="true"><b>جمعيتي</b></a>
    <h1>عرّفنا بجمعيتك</h1>
    <p class="setup-sub">نراجع بياناتك خلال يوم عمل</p>
    <label class="lbl"><span>اسم الجمعية <span class="req" aria-hidden="true">*</span></span><input class="in" name="n" required placeholder="مثلًا: جمعية نماء الأهلية"><span class="ferr" hidden>اكتب اسم الجمعية</span></label>
    <label class="lbl"><span>رقم الترخيص <span class="req" aria-hidden="true">*</span></span><input class="in ltr" name="l" required inputmode="numeric" placeholder="1234"><span class="ferr" hidden>اكتب رقم الترخيص</span></label>
    <button class="btn">تابع</button>
  </form></main>
</div>
<script>
var f=document.getElementById('sf');
function chk(){var ok=true;f.querySelectorAll('.lbl').forEach(function(l){var i=l.querySelector('.in'),e=l.querySelector('.ferr'),bad=!i.value.trim();i.classList.toggle('bad',bad);e.hidden=!bad;if(bad)ok=false;});return ok;}
f.addEventListener('submit',function(ev){ev.preventDefault();if(chk())location.href='org.html?s=new';});
if(location.hash==='#err')chk();
</script>
</body></html>
